<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- FappZap Acesso (10/2026): mesma família do FappZap (índigo, balão) e do FappZap Suporte (roxo, fone):
       o "F" laranja no quadrado, aqui AZUL-PETRÓLEO, e o selo verde é um MONITOR com o cursor (acesso remoto). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="efe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="selo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fundo)"/>
  <g stroke="#67e8f9" stroke-opacity=".35" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M60 150h70l30 30"/><path d="M60 360h50l40-40"/><path d="M452 120h-60l-24 24"/>
    <circle cx="60" cy="150" r="9" fill="#67e8f9" fill-opacity=".5" stroke="none"/>
    <circle cx="60" cy="360" r="9" fill="#67e8f9" fill-opacity=".5" stroke="none"/>
    <circle cx="452" cy="120" r="9" fill="#67e8f9" fill-opacity=".5" stroke="none"/>
  </g>
  <path d="M156 102h214v66H234v58h118v64H234v124h-78z" fill="url(#efe)" stroke="#fff7ed" stroke-width="10" stroke-linejoin="round"/>
  <!-- selo de acesso remoto: monitor com o cursor -->
  <circle cx="380" cy="380" r="100" fill="url(#selo)" stroke="#ffffff" stroke-width="14"/>
  <rect x="318" y="334" width="124" height="80" rx="12" fill="none" stroke="#ffffff" stroke-width="14"/>
  <path d="M356 440h48M380 414v26" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <path d="M368 350l40 22-17 5 10 19-9 5-10-19-14 11z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
</svg>
